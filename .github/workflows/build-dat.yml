name: Build AIMHEAD .dat Injector

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      aim_mode:
        description: 'Chế độ aim'
        required: true
        default: 'head'
        type: choice
        options: [head, body, hybrid]
      head_scale:
        description: 'Hệ số phóng đại hitbox đầu (1.0 - 5.0)'
        required: true
        default: '3.0'
        type: string
      sensitivity:
        description: 'Độ nhạy (1-10)'
        required: true
        default: '5'
        type: string

# Cấp quyền ghi cho GITHUB_TOKEN để có thể push code
permissions:
  contents: write

jobs:
  build-dat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate .dat
        env:
          AIM_MODE: ${{ github.event.inputs.aim_mode || 'head' }}
          HEAD_SCALE: ${{ github.event.inputs.head_scale || '3.0' }}
          SENSITIVITY: ${{ github.event.inputs.sensitivity || '5' }}
        run: |
          python scripts/generate_dat.py
          echo "=== Danh sách file đầu ra ==="
          ls -la output/

      - name: Commit và Push file .dat vào Repo
        run: |
          # Cấu hình danh tính Git (bắt buộc)
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Thêm toàn bộ file trong thư mục output vào git
          git add output/
          
          # Kiểm tra xem có thay đổi nào không trước khi commit
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào để commit."
          else
            git commit -m "Auto-build: Cập nhật file aimhead_patch.dat [Skip CI]"
            git push
            echo "Đã commit và push thành công!"
          fi

      - name: Upload .dat artifact (Dự phòng)
        uses: actions/upload-artifact@v4
        with:
          name: aimhead-dat
          path: |
            output/aimhead_patch.dat
            output/debug.json
          retention-days: 30
