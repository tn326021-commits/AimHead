name: Build AimLockHead v3 (Drag)
on: [push, workflow_dispatch]
jobs:
  build-dat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 tools/gen_dat_v3.py
      - uses: actions/upload-artifact@v4
        with: { name: aimlockhead-dat, path: out/ }
  build-so:
    needs: build-dat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r25c }
      - uses: actions/download-artifact@v4
        with: { name: aimlockhead-dat, path: out/ }
      - run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-${{ matrix.abi }} -j$(nproc)
      - run: |
          mkdir -p dist/${{ matrix.abi }}
          cp build-${{ matrix.abi }}/libaimlockhead.so dist/${{ matrix.abi }}/
          cp out/*.dat dist/${{ matrix.abi }}/
      - uses: actions/upload-artifact@v4
        with: { name: aimlockhead-${{ matrix.abi }}, path: dist/${{ matrix.abi }}/ }
