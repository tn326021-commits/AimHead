name: Build AimLock AssetBundle

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build AssetBundle for Windows
    runs-on: windows-latest
    
    steps:
      # 1. Checkout mã nguồn dự án
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Thiết lập Unity Editor phiên bản 2018.4.12f1
      - name: Setup Unity Project
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2018.4.12f1
          targetPlatform: StandaloneWindows64
          customParameters: -executeMethod AimLockBuilder.BuildAssetBundle -quit -batchmode -nographics

      # 3. Lưu trữ file AssetBundle đã build và mã hóa sau khi workflow chạy xong
      - name: Upload AssetBundle Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Aimlock-AssetBundle
          path: Assets/AssetBundles/Aimlock.asset
