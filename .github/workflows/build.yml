name: Build AimPatch ARM64

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true
        id: setup-ndk

      - name: Build Dobby ARM64
        run: |
          # Clone bản mới nhất của Dobby để tương thích tốt với NDK hiện tại
          git clone --depth=1 https://github.com/jmpews/Dobby.git dobby_src
          cd dobby_src

          mkdir build_arm64 && cd build_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF
          make dobby_static -j$(nproc)

          mkdir -p ../../deps/dobby/include
          DOBBY_LIB=$(find . -name "libdobby*.a" | head -1)
          cp "$DOBBY_LIB" ../../deps/dobby/libdobby_arm64-v8a.a
          find .. -name "dobby.h" -exec cp {} ../../deps/dobby/include/ \; 2>/dev/null || true

      - name: Build libaimmod.so
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=$(pwd) \
            APP_BUILD_SCRIPT=$(pwd)/jni/Android.mk \
            NDK_APPLICATION_MK=$(pwd)/jni/Application.mk \
            NDK_LIBS_OUT=$(pwd)/out/libs \
            NDK_OUT=$(pwd)/out/obj \
            -j$(nproc) V=1

      - name: Verify output
        run: |
          ls -lh out/libs/arm64-v8a/
          file out/libs/arm64-v8a/libaimmod.so

      - name: Upload libaimmod.so
        uses: actions/upload-artifact@v4
        with:
          name: libaimmod-arm64
          path: out/libs/arm64-v8a/libaimmod.so
          retention-days: 7
