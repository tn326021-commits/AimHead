name: Build AimLock AssetBundle

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build AssetBundle for Unity 2018.4.12f1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Build AssetBundle
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: 2018.4.12f1
          targetPlatform: StandaloneWindows64
          customParameters: -executeMethod AimLockBuilder.BuildAndEncryptAssetBundle
