name: Build Unity AssetBundle (2018.4.11f1)

on:
  workflow_dispatch: # Chỉ chạy khi bạn bấm nút, không tự động chạy khi push code C++

env:
  UNITY_VERSION: '2018.4.11f1'
  BUILD_TARGET: 'StandaloneWindows64'

jobs:
  build-unity-bundle:
    name: Build AssetBundle
    runs-on: ubuntu-20.04 
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ env.BUILD_TARGET }}

      - name: Build AssetBundle
        uses: game-ci/unity-builder@v2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ env.BUILD_TARGET }}
          buildMethod: Game.EditorTools.BuildAssetBundles.Build
          customParameters: >-
            -executeMethod Game.EditorTools.BuildAssetBundles.Build
            -buildTarget ${{ env.BUILD_TARGET }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-AssetBundle-aimlockhead
          path: Build/AssetBundles/**
          retention-days: 30
