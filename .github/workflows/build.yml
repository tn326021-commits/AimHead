name: Build AimLockHead v3 Drag

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate single dat
        run: python3 tools/gen_dat_v3.py out/aimlockhead.dat

      - name: Upload dat
        uses: actions/upload-artifact@v4
        with:
          name: aimlockhead-dat
          path: out/aimlockhead.dat

  build-so:
    needs: build-dat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Download dat
        uses: actions/download-artifact@v4
        with:
          name: aimlockhead-dat
          path: out/

      - name: Configure CMake
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build SO
        run: cmake --build build-${{ matrix.abi }} -j$(nproc)

      - name: Package
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp build-${{ matrix.abi }}/libaimlockhead.so dist/${{ matrix.abi }}/
          cp out/aimlockhead.dat dist/${{ matrix.abi }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aimlockhead-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/
