name: Build AimLock Ultra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate single dat
        run: |
          mkdir -p out
          cat << 'EOF' > gen.py
          import struct, zlib, time, os
          MAGIC = b"AIMC"
          VERSION = 4
          T_FLOAT, T_INT, T_BOOL, T_DOUBLE = 0, 1, 2, 3
          def pack_entry(ki, v):
              if isinstance(v, bool): return struct.pack("<HB", ki, T_BOOL) + struct.pack("<B", 1 if v else 0) + b"\x00"*7
              if isinstance(v, int): return struct.pack("<HBi", ki, T_INT, v) + b"\x00"*4
              if isinstance(v, float): return struct.pack("<HBf", ki, T_FLOAT, v) + b"\x00"*4
              return struct.pack("<HBd", ki, T_DOUBLE, float(v))
              
          cfg = {
              # TẦNG 1: ĐỘ NHẠY
              "sens_hipfire": 100, "sens_red_dot": 98, "sens_2x_scope": 90,
              "sens_4x_scope": 85, "sens_awm": 80, "sens_free_look": 100,
              # TẦNG 2: ĐIỂM CHẠM
              "touch_x_offset": -1.5, "touch_y_offset": -4.0,
              # TẦNG 3: ĐƯỜNG ĐẠN & DỰ ĐOÁN
              "bullet_speed": 880.0, "gravity": 9.81, "predict_lead_time": 0.10,
              "predict_acceleration": 0.05, "head_hitbox_scale": 1.25,
              # TẦNG 4: KÉO TÂM ULTRA
              "drag_enabled": True, "drag_mode": 2, "drag_strength_x": 0.90,
              "drag_strength_y": 0.85, "drag_smoothing": 0.10, "drag_radius_inner": 15.0,
              "drag_radius_outer": 280.0, "drag_snap_speed": 55.0, "drag_deadzone": 4.0,
              # TẦNG 5: KHÓA MỤC TIÊU
              "lock_head_only": True, "lock_ignore_knock": True, "lock_priority": 1, "lock_max_dist": 350.0,
              # TẦNG 6: CHỐNG GIẬT
              "recoil_compensation": 0.85, "recoil_smooth_step": 0.2, "shake_reduction": 0.90, "fps_stabilizer": 120
          }
          keys = list(cfg.keys())
          kidx = {k: i for i, k in enumerate(keys)}
          st = struct.pack("<H", len(keys))
          for k in keys:
              b = k.encode("utf-8")
              st += struct.pack("<H", len(b)) + b
          ent = struct.pack("<H", len(keys))
          for k, v in cfg.items(): ent += pack_entry(kidx[k], v)
          payload = st + ent
          crc = zlib.crc32(payload) & 0xFFFFFFFF
          hdr = MAGIC + struct.pack("<H", VERSION) + struct.pack("<B", 1) + struct.pack("<B", 0b00001111)
          hdr += struct.pack("<I", crc) + struct.pack("<I", len(payload)) + struct.pack("<Q", int(time.time())) + b"\x00" * 8
          
          # ĐÃ ĐỔI TÊN FILE OUTPUT TẠI ĐÂY
          with open("out/AimLock-Ultra.dat", "wb") as f:
              f.write(hdr); f.write(payload)
          print("[+] Generated out/AimLock-Ultra.dat")
          EOF
          python3 gen.py
          echo "=== DEBUG: KIỂM TRA FILE ==="
          ls -la out/

      - name: Upload dat
        uses: actions/upload-artifact@v4
        with:
          name: AimLock-Ultra-DAT
          path: out/AimLock-Ultra.dat
          if-no-files-found: error

  build-so:
    needs: build-dat
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Download dat
        uses: actions/download-artifact@v4
        with:
          name: AimLock-Ultra-DAT
          path: out/
      - name: Configure CMake
        run: |
          cmake -B build-${{ matrix.abi }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build SO
        run: cmake --build build-${{ matrix.abi }} -j$(nproc)
      - name: Package
        run: |
          mkdir -p dist/${{ matrix.abi }}
          cp build-${{ matrix.abi }}/libaimlockhead.so dist/${{ matrix.abi }}/
          cp out/AimLock-Ultra.dat dist/${{ matrix.abi }}/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimLock-Ultra-${{ matrix.abi }}
          path: dist/${{ matrix.abi }}/
