name: Python Encrypt Asset Workflow

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  encrypt-asset:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải mã nguồn kho lưu trữ về máy chủ ảo của GitHub
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Cài đặt môi trường Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      # 3. Cài đặt thư viện mã hóa pycryptodome
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      # 4. Chạy script Python để mã hóa file asset
      - name: Run Encryption Script
        run: python encrypt_asset.py

      # 5. Lưu file Aimlock.asset đã mã hóa thành Artifact trên GitHub
      - name: Upload Encrypted Asset Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Encrypted-Aimlock-Asset
          path: Assets/AssetBundles/Aimlock.asset
